{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
                Login
            {% endblock %}
            — Drone Mapping System
        </title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
              rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
        <link rel="stylesheet"
              href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    </head>
    <body>
        <div class="auth-shell">
            <div class="auth-panel">
                <div class="auth-panel-inner">
                    <svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg">
                        <rect x="20" y="30" width="200" height="140" rx="10" fill="#ffffff" stroke="#d7e3fb" stroke-width="2" />
                        <path d="M20 70 H220 M70 30 V170 M150 30 V170" stroke="#e3ecfb" stroke-width="1.5" />
                        <circle cx="95" cy="95" r="7" fill="#2563eb" />
                        <path d="M95 102 L95 130" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
                        <circle cx="150" cy="120" r="5" fill="#93b6f7" />
                        <circle cx="60" cy="130" r="4" fill="#93b6f7" />
                        <path d="M95 95 Q120 80 150 120" stroke="#93b6f7" stroke-width="2" fill="none" stroke-dasharray="4 4" />
                    </svg>
                    <h3>Map every site, from the air down</h3>
                    <p>Upload drone surveys, track processing, and review 2D &amp; 3D datasets in one place.</p>
                </div>
            </div>
            <div class="auth-form-side">
                <div class="auth-form-inner">
                    <div class="auth-mark">
                        <i class="bi bi-geo-alt-fill"></i>
                    </div>
                    {% include "shared/toasts.html" %}
                    {% block content %}{% endblock %}
                    <p class="auth-footnote">Drone Mapping System</p>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{% static 'js/auth.js' %}"></script>
    </body>
</html>
