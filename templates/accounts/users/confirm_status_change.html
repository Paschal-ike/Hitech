<div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Action</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                {% if user_object.is_active %}
                    Are you sure you want to deactivate this user?
                {% else %}
                    Are you sure you want to activate this user?
                {% endif %}
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <form method="post"
                      action="{% url 'accounts:user-status-update' user_object.pk %}">
                    {% csrf_token %}
                    <input type="hidden"
                           name="is_active"
                           value="{% if user_object.is_active %}false{% else %}true{% endif %}">
                    <button class="btn {% if user_object.is_active %}btn-danger{% else %}btn-success{% endif %}">Confirm</button>
                </form>
            </div>
        </div>
    </div>
</div>
