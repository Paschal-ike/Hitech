<div class="col-md-2 bg-light border-end min-vh-100 px-3 py-4">
    <!-- Brand / App Title Area -->
    <div class="mb-4 px-2">
        <h5 class="fw-bold tracking-tight text-dark m-0">DroneMapping</h5>
    </div>
    <!-- Navigation List -->
    <div class="nav flex-column gap-1">
        <!-- Dashboard Link -->
        <a href="{% url 'accounts:dashboard' %}"
           class="nav-link d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 fw-medium {% if request.resolver_match.url_name == 'dashboard' %} bg-white text-primary shadow-sm {% else %} text-secondary hover-bg-light {% endif %}">
            <i class="bi bi-grid-1x2-fill fs-5"></i>
            <span>Dashboard</span>
        </a>
        <!-- Projects Link (Now highlights on list, create, edit, or detail views) -->
        <a href="{% url 'projects:project-list' %}"
           class="nav-link d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 fw-medium {% if request.resolver_match.app_name == 'projects' %} bg-white text-primary shadow-sm {% else %} text-secondary hover-bg-light {% endif %}">
            <i class="bi bi-folder2 fs-5"></i>
            <span>Projects</span>
        </a>
        <!-- Surveys Link (Highlights on any view in the surveys app namespace) -->
        <a href="{% url 'surveys:survey-list' %}"
           class="nav-link d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 fw-medium {% if request.resolver_match.app_name == 'surveys' %} bg-white text-primary shadow-sm {% else %} text-secondary hover-bg-light {% endif %}">
            <i class="bi bi-compass fs-5"></i>
            <span>Surveys</span>
        </a>
        {% if request.user.is_admin %}
            <div class="text-uppercase text-muted fw-bold small tracking-wider mt-4 mb-2 px-3"
                 style="font-size: 0.75rem">Administration</div>
            <!-- Users Link -->
            <a href="{% url 'accounts:user-list' %}"
               class="nav-link d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 fw-medium {% if request.resolver_match.url_name == 'user-list' %} bg-white text-primary shadow-sm {% else %} text-secondary hover-bg-light {% endif %}">
                <i class="bi bi-people fs-5"></i>
                <span>Users</span>
            </a>
        {% endif %}
    </div>
</div>
