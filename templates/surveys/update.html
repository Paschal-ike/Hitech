{% extends "base.html" %}
{% block title %}
    Create Survey
{% endblock %}
{% block content %}
    <div class="card">
        <div class="card-header">
            <h4>Edit Survey</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {% include "shared/form.html" with form=form %}
                <div class="mt-3">
                    <button class="btn btn-primary">Update</button>
                    <a href="{% url 'surveys:survey-list' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
