{% extends "base.html" %}
{% block title %}
    Site
{% endblock %}
{% block content %}
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h4>Site</h4>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            {% include "shared/form/form.html" %}
                            <button class="btn btn-primary">Save Site</button>
                            <a href="{% url 'projects:site-list' form.instance.project.pk %}"
                               class="btn btn-secondary">Cancel</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
