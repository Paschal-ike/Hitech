{% if form.non_field_errors %}
    <div class="alert alert-danger p-3 rounded-3 mb-4 small border border-danger-subtle d-flex align-items-start gap-2.5"
         role="alert">
        <svg xmlns="http://w3.org"
             width="16"
             height="16"
             fill="currentColor"
             class="bi bi-exclamation-triangle-fill flex-shrink-0 text-danger mt-0.5"
             viewBox="0 0 16 16">
            <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" />
        </svg>
        <div class="w-100">
            <h6 class="fw-bold text-danger mb-1">Submission Errors Detected</h6>
            <ul class="mb-0 ps-3 text-danger-emphasis">
                {% for error in form.non_field_errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>
{% endif %}
