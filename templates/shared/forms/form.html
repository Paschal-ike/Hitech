<form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    <!-- Clean Alerts Terminal Block -->
    {% include "shared/forms/form_errors.html" %}
    <!-- Automatic dynamic multi-column grouping grid system spacing -->
    <div class="row row-cols-1 row-cols-md-2 g-3 mb-4">
        {% for field in form %}
            <div class="col">{% include "shared/forms/field.html" with field=field %}</div>
        {% endfor %}
    </div>
    <div class="d-flex align-items-center justify-content-end gap-2 border-top border-light-subtle pt-3">
        {% include "shared/forms/form_buttons.html" %}
    </div>
</form>
