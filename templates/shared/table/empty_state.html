<div class="text-center py-5 px-4 bg-white rounded-4 shadow-sm border-0 my-4">
    <!-- Curved Circular Visual Placeholder -->
    <div class="d-inline-flex p-4 bg-light text-secondary rounded-circle mb-3">
        <i class="bi bi-folder-plus fs-1 text-muted"></i>
    </div>
    <!-- Context Typography Block -->
    <h4 class="fw-bold text-dark mb-2">{{ title|default:"Nothing here yet" }}</h4>
    <p class="text-secondary mx-auto mb-4" style="max-width: 400px;">
        {{ message|default:"No records were found matching your current parameters." }}
    </p>
    <!-- Action Activation Link -->
    {% if create_url %}
        <a href="{{ create_url }}"
           class="btn btn-primary btn-md rounded-3 px-4 fw-medium shadow-sm d-inline-flex align-items-center gap-2">
            <i class="bi bi-plus-lg"></i>
            <span>{{ button_label|default:"Create New Record" }}</span>
        </a>
    {% endif %}
</div>
